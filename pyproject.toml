[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-cooling"
version = "0.3.0"
description = "Agent-based predictive cooling: Supervisor + Data Analyst + Cooling Advisor using sensor data, an ML forecast, 81-plan MPC and guardrails"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<4", "scikit-learn>=1.4,<2",
  "plotly>=5.19,<8", "streamlit>=1.45,<2",
  "langgraph>=1,<2", "pydantic>=2,<3",
]

[project.optional-dependencies]
gemini = ["google-genai>=1,<3"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["predictive_cooling*"]

[tool.setuptools.package-data]
"predictive_cooling.agents" = ["skill_specs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
