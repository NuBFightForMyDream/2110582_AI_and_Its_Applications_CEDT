[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-cooling"
version = "0.3.0"
description = "Mock data-center sensors -> ML forecast -> 81-plan MPC -> safety filter -> plant, with a Streamlit dashboard"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<4", "scikit-learn>=1.4,<2",
  "plotly>=5.19,<8", "streamlit>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["predictive_cooling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
